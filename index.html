<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Бегущая строка - TILATA</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        /* LED-экрандын сырткы корпусу */
        .led-board {
            background-color: #000;
            border: 10px solid #222;
            border-radius: 10px;
            padding: 20px 0;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.9);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            /* Фондук LED торчо (матрица) эффектиси */
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 4px 4px;
            position: relative;
        }

        /* Жылган текстти кармоочу контейнер */
        .marquee-container {
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
        }

        /* TILATA текстинин стили */
        .led-text {
            display: inline-block;
            color: #00ffcc; /* Жашыл-көк LED түсү */
            font-size: 80px;
            font-weight: bold;
            letter-spacing: 10px;
            padding-left: 100%;
            /* Тексттин LED сыяктуу жаркырашын берүү */
            text-shadow: 
                0 0 5px #00ffcc,
                0 0 10px #00ffcc,
                0 0 20px #00ffcc,
                0 0 40px #0088ff;
            /* Анимацияны чакыруу */
            animation: scroll-led 8s linear infinite;
        }

        /* Жылдыруу анимациясы */
        @keyframes scroll-led {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }
    </style>
</head>
<body>

    <!-- LED Экран -->
    <div class="led-board">
        <div class="marquee-container">
            <!-- Тексттин аталышы TILATA -->
            <div class="led-text">TILATA</div>
        </div>
    </div>

</body>
</html>
